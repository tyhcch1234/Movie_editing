name: auto-cut

# 收到委託單就自動剪、自動上架、自動通知。全程唔需要人手。
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      body:
        description: "委託單內容（Markdown，同網站表單一樣格式）"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-cut-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cut:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'edit-request')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安裝 ffmpeg 同依賴
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r tools/requirements.txt

      - name: 快取 whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL || 'base' }}

      - name: 寫出委託單
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_BODY: ${{ inputs.body }}
        run: |
          python - <<'PY'
          import os, pathlib
          body = os.environ.get("ISSUE_BODY") or os.environ.get("DISPATCH_BODY") or ""
          if not body.strip():
              raise SystemExit("委託單係空")
          pathlib.Path("order.md").write_text(body, encoding="utf-8")
          print("已寫入 order.md，長度", len(body))
          PY

      - name: 剪片
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_DATE: ${{ github.event.issue.created_at || '' }}
          RUN_ID: ${{ github.run_id }}
          WHISPER_MODEL: base
          X264_PRESET: veryfast
          X264_CRF: "20"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          export RUN_DATE="${RUN_DATE%%T*}"
          [ -z "$RUN_DATE" ] && export RUN_DATE="$(date -u +%F)"
          python tools/cut.py --body order.md --out .

      - name: 上架（commit + push）
        env:
          SLUG: ${{ github.run_id }}
        run: |
          git config user.name "auto-cut"
          git config user.email "actions@users.noreply.github.com"
          git add -A videos covers assets/data/edits.json
          if git diff --cached --quiet; then
            echo "冇新檔案，跳過 commit"
          else
            git commit -m "auto: 自動剪片 $(date -u +%F) (run $SLUG)"
            git push
          fi

      - name: 通知（成功）
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python tools/notify.py done

      - name: 回覆 issue（成功）
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(python -c "import json;print(json.load(open('result.json'))['url'])")
          gh issue comment "${{ github.event.issue.number }}" --body "✅ 自動剪好：$URL
          - 長度：$(python -c "import json;d=json.load(open('result.json'));print(d['duration'], d['size'], f\"{d['segments']} 段\")")"
          gh issue edit "${{ github.event.issue.number }}" --add-label "done"

      - name: 通知（失敗）
        if: failure()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          python tools/notify.py failed || true

      - name: 回覆 issue（失敗）
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ 自動剪片失敗，請睇 [執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。
          最常見原因：Drive 連結未設「知道連結的人可檢視」。"
